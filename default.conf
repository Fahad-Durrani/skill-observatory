upstream skill_observatory.app {
    server skill_observatory:8000;
}

server {
    listen 80;
    server_name localhost;  # Use localhost or your domain here

    location / {
        proxy_pass http://skill_observatory.app/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # WebSocket specific header
        proxy_set_header Connection 'upgrade';  # WebSocket specific header
        proxy_set_header Host $host;  # Preserve original Host header
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # Forward the original client IP
        proxy_redirect off;
    }
}
